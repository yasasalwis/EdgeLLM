; EdgeLLM — PlatformIO project config.
;
; These environments are used by CI to compile-test the library and examples
; across the supported board matrix. The native unit tests run separately via
; the Makefile (host clang/gcc), not through PlatformIO.
;
; Build one example for one board locally, e.g.:
;   pio ci --project-conf platformio.ini -e esp32dev \
;          --lib="." examples/01_SelfTest/01_SelfTest.ino

[platformio]
default_envs = esp32dev

[env]
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags = -Wall
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1

[env:esp8266]
platform = espressif8266
board = nodemcuv2

[env:pico_w]
; Raspberry Pi Pico W on the arduino-pico (earlephilhower) core, whose
; networking mirrors ESP8266 (BearSSL). The community platform fork is the
; standard way to get that core under PlatformIO.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
board_build.core = earlephilhower

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi

[env:nano_33_iot]
platform = atmelsam
board = nano_33_iot
; WiFiNINA provides WiFi.h / WiFiSSLClient / WiFi.getTime(); FlashStorage provides
; the EEPROM emulation used by EepromSecretStore (SAMD has no real EEPROM).
lib_deps =
    ${env.lib_deps}
    arduino-libraries/WiFiNINA
    cmaglie/FlashStorage

[env:portenta_h7]
platform = ststm32
board = portenta_h7_m7
; Portenta H7 (mbed core) — WiFi/TLS via the built-in mbed WiFi library.
