name=EdgeLLM
version=0.7.0
author=EdgeLLM Authors
maintainer=EdgeLLM Authors <yasaslive@gmail.com>
sentence=Talk to Claude, Gemini, ChatGPT and Ollama from Arduino, and expose your device to LLMs over MCP.
paragraph=High-performance, capability-tiered library with two independent features: an LLM client that returns schema-validated structured output (nested schemas, image/vision input, tool calling, retries and usage budgets across Anthropic, OpenAI, Gemini, Ollama and any OpenAI-compatible endpoint) and a full Model Context Protocol (MCP) server (tools, text and blob resources, prompts, built-in KV store, mDNS discovery) that lets networked LLM hosts discover, read and write your device's data and functions. Secure by default: TLS verification on, secrets in NVS, writes deny-by-default.
category=Communication
url=https://github.com/edgellm/EdgeLLM
architectures=esp32,esp8266,rp2040,renesas_uno,samd,mbed_portenta,mbed_nano
includes=EdgeLLM.h
depends=ArduinoJson
